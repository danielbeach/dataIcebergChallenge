[project]
name = "data-iceberg-challenge"
version = "0.1.0"
description = "An Apache Iceberg challenge built from Backblaze Drive Stats"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "duckdb>=1.2.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
drivestats-query = "drivestats_challenge.query:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drivestats_challenge"]

[tool.hatch.build.targets.wheel.force-include]
"queries" = "drivestats_challenge/queries"
